services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/b2b_marketplace?schema=public
      JWT_SECRET: super-secret-jwt-key-for-demo
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      YOOKASSA_SHOP_ID: test-shop
      YOOKASSA_SECRET_KEY: test-key
      YOOKASSA_RETURN_URL: http://localhost:5173/orders
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      DEMO_IMAGE_QUERY: ${DEMO_IMAGE_QUERY:-cats}
      DEMO_IMAGE_COUNT: ${DEMO_IMAGE_COUNT:-40}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
